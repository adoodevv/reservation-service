services:
  postgres:
    image: postgres:17-alpine
    container_name: reservations-pg
    environment:
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
      POSTGRES_DB: reservations
    ports:
      - "5433:5432"
    command:
      # The load harness opens a lot of sessions; the default 100 is not enough
      # headroom to distinguish "we ran out of connections" from "we lost a race".
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=200ms"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # Benchmarks should measure lock contention, not laptop disk fsync latency.
      - /var/lib/postgresql/data

  app:
    build: .
    container_name: reservations-app
    depends_on:
      postgres:
        # Not just "started": the service migrates before it listens, and a
        # migration against a database still doing its own init crashes the
        # container on the very first `docker compose up`.
        condition: service_healthy
    environment:
      # `postgres` is the compose service name and 5432 its container port --
      # the 5433 mapping below is for tools running on the host, not for this.
      DATABASE_URL: postgres://reservations:reservations@postgres:5432/reservations
      PORT: 3000
      HOST: 0.0.0.0
      PG_POOL_MAX: 32
      ALLOCATION_STRATEGY: optimistic
    ports:
      - "3000:3000"
    restart: unless-stopped
